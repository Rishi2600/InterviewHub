# Local development MongoDB. Credentials come from the root .env
# (MONGO_ROOT_USERNAME / MONGO_ROOT_PASSWORD), which docker compose reads
# automatically. They only apply the first time the volume is created.
#
# Pinned to 7.0: MongoDB 8.x refuses to start on Linux kernels 6.19-7.0.13
# (TCMalloc/rseq incompatibility, SERVER-121912). 7.0 uses the older
# allocator and is unaffected. Move to 8.x once the host kernel is >= 7.0.14.
services:
  mongo:
    image: mongo:7.0
    container_name: interviewhub-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Throwaway database for the end-to-end tests, started only with
  # `npm run test:e2e:db`. Same image as above, never pulled; data lives in
  # memory and is gone when the container stops.
  mongo-test:
    image: mongo:7.0
    pull_policy: never
    container_name: interviewhub-mongo-test
    profiles: ["test"]
    ports:
      - "127.0.0.1:27018:27017"
    tmpfs:
      - /data/db
    # Every test file drops and rebuilds the database, and Mongo keeps a file
    # open per collection and index: more than Docker's default 1024. 64000
    # is MongoDB's recommended limit.
    ulimits:
      nofile: { soft: 64000, hard: 64000 }
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Throwaway Redis for `npm run test:e2e:redis`, which runs the end-to-end
  # tests with Redis on. Local image, never pulled; nothing is persisted.
  redis-test:
    image: redis:7-alpine
    pull_policy: never
    container_name: interviewhub-redis-test
    profiles: ["test"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15

  # TURN relay for calls, from the local image (never pulled). Started only
  # with `docker compose --profile rtc up -d coturn`. Host networking, since
  # TURN needs a range of UDP ports. Credentials expire: the API signs them
  # with TURN_SECRET, which coturn checks. Relaying to private and local
  # addresses is refused, so the relay can't be used to reach this machine's
  # own network. See guides/calls.md.
  coturn:
    image: coturn/coturn:4.18.0-alpine
    pull_policy: never
    container_name: interviewhub-coturn
    profiles: ["rtc"]
    network_mode: host
    environment:
      TURN_SECRET: ${TURN_SECRET:-}
    # The secret is checked here, not by compose, so the rest of this file
    # works without it. Without a long enough secret coturn doesn't start:
    # an empty one would let anyone sign their own credentials.
    entrypoint:
      - sh
      - -c
      - '[ "$${#TURN_SECRET}" -ge 16 ] || { echo "Set TURN_SECRET (16+ characters) in .env" >&2; exit 1; }; exec turnserver "$$@" --static-auth-secret="$$TURN_SECRET"'
      - turnserver
    command:
      - -n
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --realm=interviewhub
      - --use-auth-secret
      - --fingerprint
      - --no-tls
      - --no-multicast-peers
      - --user-quota=12
      - --total-quota=400
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

volumes:
  mongo-data:
