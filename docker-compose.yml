# Local development MongoDB. Credentials come from the root .env
# (MONGO_ROOT_USERNAME / MONGO_ROOT_PASSWORD), which docker compose reads
# automatically. They only apply the first time the volume is created.
#
# Pinned to 7.0: MongoDB 8.x refuses to start on Linux kernels 6.19-7.0.13
# (TCMalloc/rseq incompatibility, SERVER-121912). 7.0 uses the older
# allocator and is unaffected. Move to 8.x once the host kernel is >= 7.0.14.
services:
  mongo:
    image: mongo:7.0
    container_name: interviewhub-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Throwaway database for the end-to-end tests, started only with
  # `npm run test:e2e:db`. Same image as above, never pulled; data lives in
  # memory and is gone when the container stops.
  mongo-test:
    image: mongo:7.0
    pull_policy: never
    container_name: interviewhub-mongo-test
    profiles: ["test"]
    ports:
      - "127.0.0.1:27018:27017"
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Throwaway Redis for `npm run test:e2e:redis`, which runs the end-to-end
  # tests with Redis on. Local image, never pulled; nothing is persisted.
  redis-test:
    image: redis:7-alpine
    pull_policy: never
    container_name: interviewhub-redis-test
    profiles: ["test"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  mongo-data:
