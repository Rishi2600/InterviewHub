<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InterviewHub — Contests</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="page">
    <h1>Contests &amp; Live Leaderboard</h1>
    <p class="sub">Create/activate a contest, join, score participants, watch the leaderboard update live.</p>

    <div class="panel">
      <div class="row">
        <label>Contest title <input type="text" id="ctitle" placeholder="e.g. Frontend Sprint" /></label>
        <button id="create" class="primary">Create (interviewer)</button>
      </div>
      <div class="row" style="margin-top:10px;">
        <label>Contest ID <input type="text" id="cid" placeholder="Mongo _id of a contest" /></label>
        <button id="activate" class="ghost">Activate</button>
        <button id="join" class="ghost">Join</button>
        <button id="subscribe" class="accent">Watch leaderboard</button>
        <button id="end" class="ghost">End</button>
        <span id="status" class="pill">not watching</span>
      </div>
      <div class="row" style="margin-top:10px;">
        <label>Score userId <input type="text" id="suser" placeholder="userId to score" /></label>
        <label>Delta <input type="number" id="sdelta" value="10" style="width:90px;" /></label>
        <button id="score" class="ghost">Add score (interviewer)</button>
      </div>
    </div>

    <div class="panel">
      <h3 style="margin:0 0 8px;">Leaderboard</h3>
      <table>
        <thead><tr><th>Rank</th><th>User ID</th><th>Score</th></tr></thead>
        <tbody id="board"><tr><td colspan="3" class="pill">no data yet</td></tr></tbody>
      </table>
    </div>

    <p id="msg" class="msg"></p>
    <nav class="links"><a href="/index.html">&larr; Back to sign in</a></nav>
  </div>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script src="/app.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const msg = $('msg'), board = $('board');
    let socket = null;
    const session = getSession();

    function show(text, ok) {
      msg.className = 'msg ' + (ok ? 'ok' : 'err');
      msg.textContent = text;
    }
    function render(top) {
      if (!top || !top.length) { board.innerHTML = '<tr><td colspan="3" class="pill">no data yet</td></tr>'; return; }
      board.innerHTML = top.map((e) =>
        '<tr><td>' + e.rank + '</td><td>' + e.userId + '</td><td>' + e.score + '</td></tr>'
      ).join('');
    }

    $('create').onclick = async () => {
      try { const c = await api('/contests', 'POST', { title: $('ctitle').value });
        $('cid').value = c._id || c.id; show('Created contest ' + ($('cid').value), true);
      } catch (e) { show(e.message, false); }
    };
    $('activate').onclick = async () => {
      try { await api('/contests/' + $('cid').value + '/activate', 'POST'); show('Contest active', true); }
      catch (e) { show(e.message, false); }
    };
    $('join').onclick = async () => {
      try { await api('/contests/' + $('cid').value + '/join', 'POST'); show('Joined contest', true); }
      catch (e) { show(e.message, false); }
    };
    $('score').onclick = async () => {
      try {
        await api('/contests/' + $('cid').value + '/score', 'POST',
          { userId: $('suser').value, delta: Number($('sdelta').value) });
        show('Score submitted', true);
      } catch (e) { show(e.message, false); }
    };
    $('end').onclick = async () => {
      try { await api('/contests/' + $('cid').value + '/end', 'POST'); show('Contest ended, scores synced', true); }
      catch (e) { show(e.message, false); }
    };

    $('subscribe').onclick = () => {
      const contestId = $('cid').value.trim();
      if (!contestId) return show('Enter a contest ID', false);
      if (socket) socket.disconnect();
      socket = io('/leaderboard', { auth: { token: session.token } });
      socket.on('connect', () => {
        $('status').textContent = 'watching';
        socket.emit('leaderboard:join', { contestId });
      });
      socket.on('disconnect', () => $('status').textContent = 'not watching');
      socket.on('error', (e) => show(e.message || 'socket error', false));
      socket.on('leaderboard:update', (payload) => render(payload.top));
    };
  </script>
</body>
</html>
