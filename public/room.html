<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InterviewHub — Room</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="page">
    <h1>Interview Room</h1>
    <p class="sub">Real-time chat, presence, typing indicators, pinned question.</p>

    <div class="panel">
      <div class="row">
        <label>Room ID <input type="text" id="room-id" placeholder="Mongo _id of a room" /></label>
        <button id="connect" class="primary">Connect</button>
        <button id="leave" class="ghost">Leave</button>
        <span id="status" class="pill">disconnected</span>
      </div>
      <div id="pinned" class="pill hidden" style="margin-top:10px;"></div>
    </div>

    <div class="panel">
      <div id="log" class="chat-log"></div>
      <div id="typing" class="typing"></div>
      <div class="row" style="margin-top:10px;">
        <input type="text" id="text" placeholder="Type a message..." style="flex:1;" />
        <button id="send" class="accent">Send</button>
      </div>
    </div>

    <p id="msg" class="msg"></p>
    <nav class="links"><a href="/index.html">&larr; Back to sign in</a></nav>
  </div>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script src="/app.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const log = $('log'), msg = $('msg'), typing = $('typing');
    let socket = null, roomId = null, typingTimer = null;
    const session = getSession();

    if (!session.token) {
      msg.className = 'msg err';
      msg.textContent = 'Not signed in. Go back and log in first.';
    }

    function addLine(m) {
      const div = document.createElement('div');
      div.className = 'line' + (m.type === 'system' ? ' system' : '');
      if (m.type === 'system') {
        div.textContent = m.content;
      } else {
        div.innerHTML = '<span class="who"></span>: <span class="body"></span>';
        div.querySelector('.who').textContent = m.senderName;
        div.querySelector('.body').textContent = m.content;
      }
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    $('connect').onclick = () => {
      roomId = $('room-id').value.trim();
      if (!roomId) { msg.className = 'msg err'; msg.textContent = 'Enter a room ID'; return; }
      if (socket) socket.disconnect();

      socket = io('/chat', { auth: { token: session.token } });

      socket.on('connect', () => {
        $('status').textContent = 'connected';
        socket.emit('room:join', { roomId }, (ack) => {
          if (ack && ack.pinnedQuestion) showPinned(ack.pinnedQuestion);
        });
      });
      socket.on('disconnect', () => $('status').textContent = 'disconnected');
      socket.on('error', (e) => { msg.className = 'msg err'; msg.textContent = e.message || 'socket error'; });

      socket.on('chat:history', (list) => { log.innerHTML = ''; list.forEach(addLine); });
      socket.on('chat:message', addLine);
      socket.on('chat:system', addLine);

      socket.on('chat:typing', (u) => { typing.textContent = u.username + ' is typing...'; });
      socket.on('chat:stop_typing', () => { typing.textContent = ''; });

      socket.on('question:pinned', (p) => showPinned(p.question));
      socket.on('question:unpinned', () => { $('pinned').classList.add('hidden'); });
    };

    function showPinned(q) {
      if (!q) { $('pinned').classList.add('hidden'); return; }
      $('pinned').classList.remove('hidden');
      $('pinned').textContent = 'Pinned question: ' + q;
    }

    $('leave').onclick = () => {
      if (socket && roomId) socket.emit('room:leave', { roomId });
    };

    $('send').onclick = sendMessage;
    $('text').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
      else if (socket && roomId) {
        socket.emit('chat:typing', { roomId });
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => socket.emit('chat:stop_typing', { roomId }), 900);
      }
    });

    function sendMessage() {
      const content = $('text').value.trim();
      if (!content || !socket || !roomId) return;
      socket.emit('chat:send', { roomId, content });
      socket.emit('chat:stop_typing', { roomId });
      $('text').value = '';
    }
  </script>
</body>
</html>
