<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Live coding interviews, public contests and AI practice in one place, adding up to a score out of 10."
    />
    <meta name="theme-color" content="#ffc72c" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="InterviewHub: Talk. Code. Compete." />
    <meta
      property="og:description"
      content="Live coding interviews, public contests and AI practice in one place, adding up to a score out of 10."
    />
    <title>InterviewHub: Talk. Code. Compete.</title>
    <script>
      // Apply the saved theme (or the system's) before first paint.
      try {
        const saved = localStorage.getItem('interviewhub.theme')
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
